version: "3.9"

services:
  backend:
    build: .
    container_name: fln-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseG1GC"
    restart: unless-stopped
    mem_limit: 500m
    networks:
      - fln-net

networks:
  fln-net:
    external: true